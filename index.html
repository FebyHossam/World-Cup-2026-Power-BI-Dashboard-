    background-size: 70% auto;
    background-position: 120% 60%;
    background-repeat: no-repeat;
    filter: brightness(0.6) saturate(1.1);
    z-index: 1;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, rgba(5,10,30,0.92) 25%, rgba(5,10,30,0.55) 65%, rgba(5,10,30,0.25) 100%);
    z-index: 2;
  }
  .particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffd35c;
    opacity: 0;
    z-index: 3;
    animation: floatUp 5s ease-in infinite;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) translateX(0); }
    15% { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(-260px) translateX(30px); }
  }
  .logo {
    position: absolute;
    left: 5%;
    top: 6%;
    width: 92px;
    z-index: 6;
    opacity: 0;
    animation: fadeIn .7s ease forwards, floatLogo 4s ease-in-out infinite;
    animation-delay: .1s, 1s;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5));
  }
  @keyframes floatLogo {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .badge {
    position: absolute;
    left: 7%;
    top: 24%;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #6bd9ff;
    z-index: 5;
    opacity: 0;
    animation: fadeIn .6s ease forwards;
    animation-delay: .3s;
  }
  .titles {
    position: absolute;
    left: 7%;
    top: 33%;
    z-index: 5;
  }
  .titles div {
    font-size: 4.6vw;
    font-weight: 900;
    line-height: 1.05;
    color: #ffffff;
    text-shadow: 0 4px 18px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateX(-40px);
    animation: slideIn .7s ease forwards;
  }
  .titles div span {
    background: linear-gradient(90deg, #ffd35c, #ff6f61);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .titles div:nth-child(1) { animation-delay: .5s; }
  .titles div:nth-child(2) { animation-delay: .75s; }
  @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
  .sub {
    position: absolute;
    left: 7%;
    top: 57%;
    z-index: 5;
    font-size: 16px;
    color: #dbe9ff;
    max-width: 460px;
    line-height: 1.6;
    opacity: 0;
    animation: fadeIn .6s ease forwards;
    animation-delay: 1.1s;
  }
  .cta {
    position: absolute;
    left: 7%;
    bottom: 10%;
    z-index: 8;
    padding: 14px 36px;
    font-size: 16px;
    font-weight: bold;
    color: #0a1030;
    background: linear-gradient(90deg, #ffd35c, #ffb347);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 22px rgba(255,179,71,0.35);
    opacity: 0;
    animation: fadeIn .6s ease forwards, pulse 2.4s ease-in-out infinite;
    animation-delay: 1.4s, 2.1s;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
