<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 | Match Results</title>
<style>
:root{--navy:#030b19;--navy2:#0b1a31;--card:#0d1d36;--gold:#f4b83f;--gold2:#ffd56a;--white:#f8fafc;--muted:#9eacc1}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,"Segoe UI",sans-serif;background:#030b19;color:var(--white)}
body{overflow:hidden}
.page{position:relative;width:100%;min-height:100vh;padding:26px 4vw 20px;background:
radial-gradient(circle at 50% 48%,#1e416f42,transparent 43%),
radial-gradient(circle at 7% 78%,#f4b83f12,transparent 30%),
linear-gradient(135deg,#030b19,#071426 60%,#030914);overflow:hidden}
.frame{position:absolute;inset:10px;border:1px solid #7598c644;border-radius:24px;pointer-events:none}
.header{position:relative;z-index:5;max-width:1200px;margin:auto;padding:4px 20px 18px;border-bottom:1px solid #ffffff1c;direction:ltr}
.kicker{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:4px;text-transform:uppercase}
.title{margin:6px 0 0;font-size:clamp(38px,5.2vw,66px);line-height:.95;letter-spacing:-2px;font-weight:900}
.title span{color:var(--gold)}
.subtitle{margin-top:10px;color:var(--muted);font-size:14px;letter-spacing:4px}
.trophy{position:absolute;right:8px;top:-14px;width:105px;height:125px;display:flex;align-items:center;justify-content:center}
.trophy img{width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;filter:drop-shadow(0 0 14px #f4b83f66)}
.carousel{position:relative;z-index:5;width:min(100%,1080px);margin:10px auto 0;direction:ltr}
.arrow{height:30px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:34px;font-weight:900;cursor:pointer;user-select:none;transition:.2s}
.arrow:hover{transform:scale(1.15);color:var(--gold2)}
.stage-wrap{position:relative;height:430px;overflow:hidden;direction:ltr}
.card{position:absolute;inset:0;padding:28px 42px;border:1.5px solid var(--gold);border-radius:28px;
background:radial-gradient(circle at 50% 30%,#31589442,transparent 44%),linear-gradient(135deg,#132746,#071326 67%);
box-shadow:0 0 34px #f4b83f29,inset 0 0 45px #ffffff05;display:none;direction:ltr}
.card.active{display:block;animation:cardIn .45s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.match-top{text-align:center}
.badge{display:inline-block;padding:8px 22px;border-radius:11px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#101827;font-weight:900;letter-spacing:1px}
.stage{margin-top:9px;color:var(--muted);font-size:13px;letter-spacing:1px}
.teams{margin:28px 0 22px;display:grid;grid-template-columns:1fr 220px 1fr;align-items:center;gap:16px}
.team{text-align:center}
.flag{width:102px;height:102px;margin:0 auto 11px;border-radius:50%;display:grid;place-items:center;background:#fffffff2;border:3px solid var(--gold);font-size:57px;box-shadow:0 0 20px #f4b83f25}
.team.winner .flag{box-shadow:0 0 28px #f4b83f99,0 0 55px #f4b83f33}
.name{font-size:clamp(18px,2.1vw,25px);font-weight:900}
.score{text-align:center}
.scoreline{display:flex;justify-content:center;align-items:center;gap:17px;font-size:clamp(48px,6vw,78px);font-weight:900;line-height:1}
.scoreline .win{color:var(--gold2)}
.dash{color:#fff}
.winner-label{margin-top:13px;color:var(--gold);font-weight:900;letter-spacing:1.5px;font-size:14px}
.winner-name{margin-top:4px;font-weight:800;font-size:16px}
.details{border-top:1px solid #f4b83f38;padding-top:17px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.detail{text-align:center;padding:0 10px}
.detail:not(:last-child){border-right:1px solid #ffffff1c}
.label{color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.value{font-size:14px;font-weight:700}
.dots{display:flex;justify-content:center;gap:7px;margin:9px auto 0;max-width:100%;overflow:hidden}
.dot{width:7px;height:7px;border-radius:50%;background:#34435a;flex:0 0 auto}
.dot.active{background:var(--gold);box-shadow:0 0 9px #f4b83f88;transform:scale(1.35)}
.footer{position:relative;z-index:5;max-width:1200px;margin:8px auto 0;display:flex;justify-content:space-between;align-items:center;direction:ltr}
.action{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:22px;padding:8px 16px;font-weight:700}
.footer-text{color:var(--gold);font-size:11px;letter-spacing:5px;font-weight:700}
@media(max-width:760px){
.page{padding:22px 18px}.trophy{display:none}.stage-wrap{height:560px}.card{padding:22px 16px}
.teams{grid-template-columns:1fr;gap:9px}.score{order:2}.team:first-child{order:1}.team:last-child{order:3}
.flag{width:72px;height:72px;font-size:42px}.details{grid-template-columns:1fr}.detail:not(:last-child){border-right:0;border-bottom:1px solid #ffffff1c;padding-bottom:9px}
.footer{flex-direction:column;gap:10px}
}
</style>
</head>

let index=0;
let timer=null;
const cards=document.getElementById("cards");
const dots=document.getElementById("dots");

function makeCard(m,i){
 const t1win=m.score1!==null && m.score2!==null && m.score1>m.score2;
 const t2win=m.score1!==null && m.score2!==null && m.score2>m.score1;
 const card=document.createElement("section");
 card.className="card"+(i===0?" active":"");
 card.innerHTML=`
  <div class="match-top">
   <div class="badge">MATCH ${m.number}</div>
   <div class="stage">${m.stage}</div>
  </div>
  <div class="teams">
   <div class="team ${t1win?"winner":""}">
    <div class="flag">${m.flag1}</div><div class="name">${m.team1}</div>
   </div>
   <div class="score">
    <div class="scoreline">
     <span class="${t1win?"win":""}">${m.score1??""}</span>
     <span class="dash">-</span>
     <span class="${t2win?"win":""}">${m.score2??""}</span>
    </div>
    <div class="winner-label">${m.winner==="تعادل"?"MATCH DRAW":"🏆 WINNER"}</div>
    <div class="winner-name">${m.winner}</div>
   </div>
   <div class="team ${t2win?"winner":""}">
    <div class="flag">${m.flag2}</div><div class="name">${m.team2}</div>
   </div>
  </div>
  <div class="details">
   <div class="detail"><div class="label">DATE</div><div class="value">${m.date}</div></div>
   <div class="detail"><div class="label">STADIUM</div><div class="value">${m.stadium}</div></div>
   <div class="detail"><div class="label">CITY</div><div class="value">${m.city}</div></div>
  </div>`;
 cards.appendChild(card);
}
matches.forEach(makeCard);

matches.forEach((_,i)=>{
 const d=document.createElement("span");
 d.className="dot"+(i===0?" active":"");
 d.addEventListener("click",()=>go(i));
 dots.appendChild(d);
});

function go(n){
 const all=cards.querySelectorAll(".card");
 const ds=dots.querySelectorAll(".dot");
 all[index].classList.remove("active");
 ds[index].classList.remove("active");
 index=(n+matches.length)%matches.length;
 all[index].classList.add("active");
 ds[index].classList.add("active");
}
function next(){go(index+1);reset();}
function prev(){go(index-1);reset();}
function reset(){clearInterval(timer);timer=setInterval(()=>go(index+1),2000);}
document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;
reset();
</script>
