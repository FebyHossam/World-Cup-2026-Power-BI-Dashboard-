<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Cup 2026 - Match Results</title>
<style>
:root{--navy:#050d1c;--card:#101f3a;--gold:#f4b83f;--gold2:#ffd56a;--white:#f7f9fc;--muted:#9daabd}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 45%,#1f437733,transparent 42%),radial-gradient(circle at 10% 80%,#f4b83f14,transparent 28%),var(--navy);color:var(--white)}
.page{position:relative;width:1920px;height:1080px;padding:55px 90px 40px;overflow:hidden}
.page:before{content:"";position:absolute;inset:24px;border:1px solid #7197cf47;border-radius:28px;pointer-events:none}
.header{position:relative;z-index:2;max-width:1400px;margin:auto;padding:14px 12px 30px;border-bottom:1px solid #ffffff22}
.kicker{color:var(--gold);font-size:18px;font-weight:700;letter-spacing:5px;text-transform:uppercase}
.title{margin:10px 0 0;font-size:74px;line-height:.98;letter-spacing:-2px;font-weight:900}
.title span{color:var(--gold)}
.subtitle{margin:14px 0 0;color:var(--muted);font-size:19px;letter-spacing:5px}
.trophy{position:absolute;right:10px;top:-10px;width:130px;filter:drop-shadow(0 0 18px #f4b83f66)}
.carousel{position:relative;z-index:2;width:min(100%,1280px);margin:40px auto 0;display:flex;flex-direction:column;align-items:center}
.nav-arrow{width:64px;height:46px;border:0;background:transparent;color:var(--gold);font-size:46px;line-height:1;cursor:pointer;transition:.2s}
.nav-arrow:hover{transform:scale(1.16);color:var(--gold2)}
.card-wrap{width:100%;perspective:1200px}
.match-card{width:100%;min-height:470px;padding:38px 56px;border:1.5px solid var(--gold);border-radius:30px;background:radial-gradient(circle at 50% 35%,#31589442,transparent 42%),linear-gradient(135deg,#132746,#071326 65%);box-shadow:0 0 40px #f4b83f21,inset 0 0 44px #ffffff05;position:relative;overflow:hidden}
.match-card:after{content:"";position:absolute;inset:0;border-radius:30px;box-shadow:inset 0 0 48px #f4b83f12;pointer-events:none}
.match-top{text-align:center;position:relative;z-index:1}
.match-badge{display:inline-block;padding:11px 30px;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111827;font-weight:900;letter-spacing:1.5px;font-size:19px}
.stage{margin-top:12px;color:var(--muted);font-size:16px;letter-spacing:1.5px}
.teams{margin:40px 0 32px;display:grid;grid-template-columns:1fr 240px 1fr;align-items:center;gap:22px}
.team{text-align:center}
.flag{width:120px;height:120px;margin:0 auto 16px;display:grid;place-items:center;border-radius:50%;background:#fffffff2;border:3px solid var(--gold);box-shadow:0 0 20px #f4b83f29;overflow:hidden}
.flag img{width:78%;height:78%;object-fit:cover;border-radius:50%}
.team-name{font-size:27px;font-weight:900}
.score{text-align:center}
.score-line{display:flex;justify-content:center;align-items:center;gap:20px;font-size:88px;font-weight:900;line-height:1}
.winner-score{color:var(--gold2)}
.score-dash{color:#fff}
.winner{margin-top:16px;color:var(--gold);font-weight:900;letter-spacing:1.5px;font-size:17px}
.winner-team{color:#fff;margin-top:6px;font-weight:800;font-size:19px}
.details{border-top:1px solid #f4b83f38;padding-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;position:relative;z-index:1}
.detail{text-align:center;padding:0 14px}
.detail:not(:last-child){border-right:1px solid #ffffff1f}
.detail-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.detail-value{font-size:17px;font-weight:700}
.dots{display:flex;gap:8px;justify-content:center;margin:24px 0 0;flex-wrap:wrap;max-width:900px}
.dot{width:9px;height:9px;border-radius:50%;background:#34435a;cursor:pointer;transition:.2s}
.dot.active{width:11px;height:11px;background:var(--gold);box-shadow:0 0 10px #f4b83f80}
.footer{position:relative;z-index:2;max-width:1400px;margin:26px auto 0;text-align:center}
.footer-text{color:var(--gold);letter-spacing:6px;font-size:14px;font-weight:700}
.flip-out{transform:rotateX(90deg);opacity:0}
.flip-in{animation:flipIn .5s ease both}
  .dashboard-btn{
  display:inline-block;
  padding:14px 32px;
  background:#FFC84B;
  color:#06162D;
  font-weight:800;
  font-size:16px;
  text-decoration:none;
  border-radius:30px;
  box-shadow:0 0 18px #FFC84B88;
}
@keyframes flipIn{from{transform:rotateX(-70deg);opacity:0}to{transform:rotateX(0);opacity:1}}
</style>
</head>

let current=0,timer;
const $=id=>document.getElementById(id);
function winnerText(m){
  if(m.score1>m.score2) return m.team1;
  if(m.score2>m.score1) return m.team2;
  return m.pens ? "DECIDED ON PENALTIES" : "DRAW";
}
function flagUrl(iso){ return "https://flagcdn.com/w160/"+iso+".png"; }
function fill(m){
  $("matchNumber").textContent="MATCH "+m.number;
  $("stage").textContent=m.stage;
  $("team1").textContent=m.team1;
  $("team2").textContent=m.team2;
  $("flag1").src=flagUrl(m.iso1);
  $("flag2").src=flagUrl(m.iso2);
  $("score1").textContent=m.score1;
  $("score2").textContent=m.score2;
  $("winner").textContent=winnerText(m);
  $("date").textContent=m.date;
  $("stadium").textContent=m.stadium;
  $("city").textContent=m.city;
  $("score1").classList.toggle("winner-score",m.score1>m.score2);
  $("score2").classList.toggle("winner-score",m.score2>m.score1);
}
function render(i,animate=true){
  const card=$("matchCard");
  if(animate){
    card.classList.remove("flip-in");card.classList.add("flip-out");
    setTimeout(()=>{fill(matches[i]);card.classList.remove("flip-out");card.classList.add("flip-in")},220);
  } else fill(matches[i]);
  document.querySelectorAll(".dot").forEach((d,n)=>d.classList.toggle("active",n===i));
}
function next(){current=(current+1)%matches.length;render(current)}
function prev(){current=(current-1+matches.length)%matches.length;render(current)}
function reset(){clearInterval(timer);timer=setInterval(next,2000)}
matches.forEach((_,i)=>{const d=document.createElement("span");d.className="dot"+(i===0?" active":"");d.onclick=()=>{current=i;render(i);reset()};$("dots").appendChild(d)});
$("nextBtn").onclick=()=>{next();reset()};
$("prevBtn").onclick=()=>{prev();reset()};
render(0,false);reset();
</script>
